[package]
name = "tokenectomy-git"
version = "1.0.0"
edition = "2024"
description = "Autonomous Git Workflow & GitHub PR Creation MCP Server for AI coding agents (Claude, Cursor, Cline). Part of Tokenectomy."
license = "MIT"
repository = "https://github.com/daffa2555/tokenectomy-git"
homepage = "https://github.com/daffa2555/tokenectomy-git"
documentation = "https://docs.rs/tokenectomy-git"
readme = "README.md"
keywords = ["mcp", "git", "ai-agent", "pull-request", "automation"]
categories = ["development-tools", "command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tokenectomy_git"
path = "src/lib.rs"

[[bin]]
name = "tokenectomy-git"
path = "src/main.rs"


[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

