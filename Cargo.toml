[package]
name = "tokenectomy-git"
version = "1.0.0"
edition = "2024"
description = "Git Workflow MCP Server — Autonomous branch, commit, and PR creation for AI coding assistants. Part of the Tokenectomy ecosystem."
license = "MIT"
repository = "https://github.com/daffa2555/tokenectomy-git"
keywords = ["mcp", "git", "ai", "debugging", "automation"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
